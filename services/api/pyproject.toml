[project]
name = "scentiq-api"
version = "0.1.0"
description = "FastAPI serving layer for the ScentIQ recommendation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "scentiq-ml",
    "sentry-sdk[fastapi]>=2.19,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.8,<1"]

[tool.uv.sources]
scentiq-ml = { path = "../../ml", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
