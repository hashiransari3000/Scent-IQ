[project]
name = "scentiq-ml"
version = "0.1.0"
description = "ScentIQ data pipeline, clustering, simulation and recommendation models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "pyarrow>=17,<22",
  "joblib>=1.4,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scentiq_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
